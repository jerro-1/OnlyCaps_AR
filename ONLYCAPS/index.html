<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ONLYCaps</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            heading: ['Anton', 'sans-serif'],
            body: ['Poppins', 'sans-serif'],
          },
          colors: {
            accent: '#00BFFF',
            dark: '#000000',
            light: '#ffffff',
          },
        },
      },
    };
  </script>

  <style>
    /* Aggressive CSS class for fixed header padding */
    .navbar-padding {
        padding-left: 40px !important; 
        padding-right: 40px !important;
    }
    
    /* Standard CSS for the Background Images */
    .hero-background {
        background-image: url('images/FRONT PAGE.png');
        background-size: cover;
        background-position: center;
        background-repeat: no-repeat;
    }
    
    .grid-section-1 {
        background-image: url('images/FITTED CAPS.png');
        background-size: cover;
        background-position: center;
    }
    
    .grid-section-2 {
        background-image: url('images/A FRAMES.png');
        background-size: cover;
        background-position: center;
    }
    
    .grid-section-3 {
        background-image: url('images/TRUCKER.png');
        background-size: cover;
        background-position: center;
    }
    
    .grid-section-4 {
        background-image: url('images/MORE STUFF.png');
        background-size: cover;
        background-position: center;
    }

    /* Grid lines */
    .grid-border-right {
        border-right: 2px solid white;
    }
    
    .grid-border-bottom {
        border-bottom: 2px solid white;
    }

    /* Logo styling */
    .logo-img {
        height: 40px;
        width: auto;
    }

    /* Button hover animations */
    .btn-hover {
        transition: all 0.3s ease-in-out;
        transform: translateY(0);
    }
    
    .btn-hover:hover {
        transform: translateY(-5px) scale(1.05);
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
    }

    /* Navigation link hover effect */
    .nav-link {
        position: relative;
        transition: color 0.3s ease;
    }
    
    .nav-link:hover {
        color: #00BFFF;
    }
    
    .nav-link::after {
        content: '';
        position: absolute;
        width: 0;
        height: 2px;
        bottom: -5px;
        left: 0;
        background-color: #00BFFF;
        transition: width 0.3s ease;
    }
    
    .nav-link:hover::after {
        width: 100%;
    }

    /* Clickable grid section */
    .clickable-section {
        cursor: pointer;
        transition: all 0.3s ease;
    }
    
    .clickable-section:hover {
        transform: scale(1.02);
    }
    
    /* Smooth scrolling for anchor links */
    html {
      scroll-behavior: smooth;
    }
  </style>
  
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body class="bg-white text-black font-body">

  <!-- Fixed Header -->
  <header class="w-full bg-white shadow-sm fixed top-0 z-50">
    <nav class="flex justify-between items-center py-4 navbar-padding">
      <!-- Left Navigation -->
      <ul class="flex gap-8 text-base tracking-wide"> 
        <li><a href="#" class="nav-link transition">HOME</a></li>
        <li><a href="#" class="nav-link transition">SHOP</a></li>
        <li><a href="#" class="nav-link transition">FITTING RECOMMENDATION</a></li>
      </ul>
      
      <!-- Centered Logo Image -->
      <div class="absolute left-1/2 transform -translate-x-1/2">
        <a href="index.html">
          <img src="images/LOGO.png" alt="ONLYCaps" class="logo-img">
        </a>
      </div>
      
      <!-- Empty div to balance the flex layout -->
      <div class="w-1/3"></div>
    </nav>
  </header>

  <!-- Hero Section -->
  <section class="relative flex items-start w-full h-screen hero-background mt-16 pt-20">
    <!-- Content Container - Positioned higher with larger text -->
    <div class="flex flex-col justify-start items-start px-10 md:px-20 w-full md:w-1/2 h-full relative z-10 mt-16">
      <h1 class="text-7xl md:text-8xl font-heading mb-8 tracking-wide text-white uppercase">FITTED CAPS</h1> 
      
      <p class="text-gray-200 text-lg md:text-xl max-w-md leading-relaxed mb-10">
        Discover the perfect fit with our premium collection of authentic fitted boxed caps and exclusive designs.
      </p>
      
      <!-- Updated button with anchor link -->
      <a href="#fitted-caps-section" class="btn-hover bg-white text-black px-10 py-4 rounded-full font-medium hover:bg-gray-200 transition text-base tracking-wide inline-block">
        Shop Collection
      </a>
    </div>
  </section>

  <!-- 4-Grid Sections -->
  <section class="w-full min-h-screen mt-16">
    <div class="grid grid-cols-2 grid-rows-2 h-screen">
      <!-- Grid 1 - FITTED CAPS - Added ID for anchor link -->
      <a id="fitted-caps-section" href="fitted-caps.html" class="clickable-section relative grid-section-1 grid-border-right grid-border-bottom flex items-end justify-center p-10">
        <div class="relative z-10 text-center mb-16">
          <h2 class="text-5xl md:text-6xl font-heading mb-6 tracking-wide text-white uppercase">FITTED CAPS</h2>
          <div class="btn-hover bg-white text-black px-8 py-3 rounded-full font-medium hover:bg-gray-200 transition text-sm tracking-wide inline-block">
            SHOP NOW
          </div>
        </div>
      </a>

      <!-- Grid 2 - A-FRAMES -->
      <a href="aframes.html" class="clickable-section relative grid-section-2 grid-border-bottom flex items-end justify-center p-10">
        <div class="relative z-10 text-center mb-16">
          <h2 class="text-5xl md:text-6xl font-heading mb-6 tracking-wide text-white uppercase">A-FRAMES</h2>
          <div class="btn-hover bg-white text-black px-8 py-3 rounded-full font-medium hover:bg-gray-200 transition text-sm tracking-wide inline-block">
            SHOP NOW
          </div>
        </div>
      </a>
      
      <!-- Grid 3 - TRUCKER -->
      <a href="trucker.html" class="clickable-section relative grid-section-3 grid-border-right flex items-end justify-center p-10">
        <div class="relative z-10 text-center mb-16">
          <h2 class="text-5xl md:text-6xl font-heading mb-6 tracking-wide text-white uppercase">TRUCKER</h2>
          <div class="btn-hover bg-white text-black px-8 py-3 rounded-full font-medium hover:bg-gray-200 transition text-sm tracking-wide inline-block">
            SHOP NOW
          </div>
        </div>
      </a>

    
<a href="more-stuff.html" class="clickable-section relative grid-section-4 flex items-end justify-center p-10">
  <div class="absolute inset-0 bg-black/40"></div>
  <div class="relative z-10 text-center mb-16">
    <h2 class="text-5xl md:text-6xl font-heading mb-6 tracking-wide text-white uppercase">MORE STUFF</h2>
    <div class="btn-hover bg-white text-black px-8 py-3 rounded-full font-medium hover:bg-gray-200 transition text-sm tracking-wide inline-block">
      SHOP NOW
    </div>
  </div>
</a>
    </div>
  </section>

</body>
</html>
